name: AI Autonomous Trader

on:
  schedule:
    # Har 15 minute baad automatically cloud par chalega
    - cron: '*/15 * * * *'
  workflow_dispatch: # Taake aap jab chahein button daba kar bhi run kar sakein

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Agent Turn
        run: |
          python agent.py
